@version: 4.11

# Global options
options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("root");
    group("root");
    perm(0640);
    bad_hostname("^gconfd$");
    keep_timestamp(yes);
};

# Sources
source s_network {
    # UDP port 514 (standard syslog - most routers use this)
    udp(port(514) ip("0.0.0.0"));
    
    # TCP port 514 (optional, more reliable but slower)
    tcp(port(514) ip("0.0.0.0"));
};

# Destinations - organized by device type
destination d_router {
    file("/syslog/${HOST}/router.log"
        template("${ISODATE} ${MSGHDR}${MSG}\n")
        create_dirs(yes));
};

destination d_archive {
    file("/syslog/archive/syslog-$YEAR-$MONTH-$DAY.log"
        template("${ISODATE} ${MSGHDR}${MSG}\n"));
};

# Log flow rules
log {
    source(s_network);
    destination(d_router);
    destination(d_archive);
};
